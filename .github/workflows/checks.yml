name: Reference checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NumPy
        run: python -m pip install -r requirements.txt
      - name: Check mathematical and protocol properties
        run: python -m unittest discover -s tests -v
      - name: Reproduce reference experiments
        run: python -m prairie_fire.experiments --output results/latest.json
