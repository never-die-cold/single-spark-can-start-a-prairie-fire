[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prairie-fire-research"
version = "0.1.0"
description = "Reference checks for compressed response contracts in collaborative training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
include = ["prairie_fire*"]
